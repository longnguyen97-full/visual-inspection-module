[project]
name = "visual-inspection-module"
version = "0.1.0"
description = "Vision Inspection & Visual Regression Tool for Agentic AI"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "scikit-image>=0.22.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "playwright>=1.62.0",
    "streamlit>=1.62.0",
    "python-pptx>=1.0.2",
    "matplotlib>=3.11.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "playwright>=1.42.0",
    "streamlit>=1.32.0",
]
